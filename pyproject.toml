[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tumor-heterogeneity"
version = "0.2.0"
description = "Multi-model intratumor heterogeneity analysis for 3D CT imaging"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "matplotlib>=3.7",
  "nibabel>=5",
  "numpy>=1.24",
  "openpyxl>=3.1",
  "pandas>=2",
  "scikit-image>=0.21",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "seaborn>=0.13",
  "SimpleITK>=2.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
survival = ["lifelines>=0.28"]
analysis = ["requests>=2.31"]
dev = ["pytest>=8", "pytest-cov>=5"]
docs = ["sphinx>=7,<9", "sphinx-rtd-theme>=2,<4", "myst-parser>=2,<5"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
